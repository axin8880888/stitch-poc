<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="phoneBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
  </defs>

  <!-- Phone frame -->
  <rect x="50" y="20" width="340" height="740" rx="30" fill="none" stroke="#555" stroke-width="3"/>
  <rect x="65" y="35" width="310" height="710" rx="20" fill="url(#phoneBg)"/>

  <!-- Status bar -->
  <text x="80" y="60" fill="#aaa" font-size="12">9:41</text>
  <text x="340" y="60" fill="#aaa" font-size="12" text-anchor="end">📶 🔋</text>

  <!-- Viewfinder area -->
  <rect x="65" y="60" width="310" height="480" fill="#0d0d1a"/>
  <rect x="65" y="60" width="310" height="480" fill="none" stroke="#333" stroke-width="1"/>

  <!-- Grid overlay lines -->
  <line x1="168" y1="60" x2="168" y2="540" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="272" y1="60" x2="272" y2="540" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="65" y1="220" x2="375" y2="220" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="65" y1="380" x2="375" y2="380" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Overlap guide line (right third) -->
  <line x1="290" y1="70" x2="290" y2="530" stroke="rgba(0,200,255,0.5)" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- Frame count badge -->
  <rect x="75" y="70" width="50" height="22" rx="4" fill="rgba(0,0,0,0.6)"/>
  <text x="100" y="85" fill="#0cf" font-size="14" text-anchor="middle" font-weight="bold">2/5</text>

  <!-- Lens info -->
  <rect x="280" y="70" width="80" height="22" rx="4" fill="rgba(0,0,0,0.6)"/>
  <text x="320" y="85" fill="#aaa" font-size="10" text-anchor="middle">70mm</text>

  <!-- Thumbnail strip background -->
  <rect x="65" y="548" width="310" height="60" fill="rgba(0,0,0,0.7)"/>

  <!-- Previous frames thumbnails -->
  <rect x="78" y="555" width="48" height="40" rx="3" fill="#2a2a3e"/>
  <image x="78" y="555" width="48" height="40" preserveAspectRatio="xMidYMid slice"/>
  <text x="102" y="580" fill="#0cf" font-size="9" text-anchor="middle">1</text>

  <rect x="132" y="555" width="48" height="40" rx="3" fill="#2a2a3e"/>
  <text x="156" y="580" fill="#0cf" font-size="9" text-anchor="middle">2</text>

  <!-- Current/next area -->
  <rect x="188" y="553" width="52" height="44" rx="3" fill="none" stroke="#0cf" stroke-width="1.5"/>
  <text x="214" y="580" fill="#0cf" font-size="9" text-anchor="middle">3 ▶</text>

  <rect x="246" y="555" width="48" height="40" rx="3" fill="#1a1a2e" stroke-dasharray="3,3" stroke="#444"/>
  <text x="270" y="580" fill="#555" font-size="9" text-anchor="middle">4</text>

  <rect x="300" y="555" width="48" height="40" rx="3" fill="#1a1a2e" stroke-dasharray="3,3" stroke="#444"/>
  <text x="324" y="580" fill="#555" font-size="9" text-anchor="middle">5</text>

  <!-- Bottom bar -->
  <rect x="65" y="610" width="310" height="130" fill="rgba(0,0,0,0.85)"/>

  <!-- Cancel button -->
  <rect x="75" y="650" width="70" height="44" rx="22" fill="none" stroke="#ff4757" stroke-width="1.5"/>
  <text x="110" y="677" fill="#ff4757" font-size="13" text-anchor="middle">取消</text>

  <!-- Shutter button -->
  <circle cx="220" cy="672" r="28" fill="none" stroke="#fff" stroke-width="3"/>
  <circle cx="220" cy="672" r="22" fill="#fff"/>

  <!-- Done button -->
  <rect x="290" y="650" width="70" height="44" rx="22" fill="#0cf" opacity="0.3"/>
  <text x="325" y="677" fill="#0cf" font-size="13" text-anchor="middle" opacity="0.3">完成</text>

  <!-- Direction hint -->
  <text x="220" y="635" fill="#666" font-size="10" text-anchor="middle">向左平移拍摄 →</text>

  <!-- Stitch label -->
  <text x="220" y="740" fill="#0cf" font-size="10" text-anchor="middle" opacity="0.6">接片模式</text>

  <!-- Labels -->
  <text x="500" y="100" fill="#fff" font-size="18" font-weight="bold">光·边界 — 接片相机界面</text>
  <text x="500" y="125" fill="#aaa" font-size="13">Stitch Camera UI Wireframe v0.1</text>

  <!-- Legend -->
  <rect x="500" y="150" width="280" height="200" rx="8" fill="#1a1a2e" stroke="#333" stroke-width="1"/>
  <text x="515" y="175" fill="#0cf" font-size="13" font-weight="bold">图例</text>
  <line x1="515" y1="195" x2="535" y2="195" stroke="rgba(0,200,255,0.5)" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="545" y="200" fill="#ccc" font-size="11">重叠引导线 (上一帧边界)</text>
  <rect x="515" y="215" width="20" height="14" rx="2" fill="#2a2a3e" stroke="#0cf" stroke-width="1"/>
  <text x="545" y="227" fill="#ccc" font-size="11">当前帧 (亮框)</text>
  <rect x="515" y="238" width="20" height="14" rx="2" fill="#1a1a2e" stroke-dasharray="3,3" stroke="#444"/>
  <text x="545" y="250" fill="#ccc" font-size="11">未拍摄帧 (虚线)</text>
  <circle cx="525" cy="272" r="6" fill="none" stroke="#0cf" stroke-width="1.5" opacity="0.3"/>
  <text x="545" y="277" fill="#ccc" font-size="11">完成按钮 (帧数不足时置灰)</text>

  <!-- Interaction flow below -->
  <text x="500" y="400" fill="#fff" font-size="16" font-weight="bold">交互流程</text>

  <!-- Flow boxes -->
  <rect x="500" y="420" width="120" height="36" rx="6" fill="#0cf" opacity="0.15" stroke="#0cf" stroke-width="1"/>
  <text x="560" y="443" fill="#0cf" font-size="11" text-anchor="middle">主相机界面</text>

  <text x="635" y="438" fill="#aaa" font-size="18">→</text>

  <rect x="660" y="420" width="120" height="36" rx="6" fill="#0cf" opacity="0.15" stroke="#0cf" stroke-width="1"/>
  <text x="720" y="443" fill="#0cf" font-size="11" text-anchor="middle">接片模式</text>

  <text x="795" y="438" fill="#aaa" font-size="18">→</text>

  <rect x="500" y="475" width="120" height="36" rx="6" fill="#2a2a3e" stroke="#555" stroke-width="1"/>
  <text x="560" y="498" fill="#ccc" font-size="11" text-anchor="middle">拍第 1 帧</text>

  <text x="635" y="493" fill="#aaa" font-size="18">→</text>

  <rect x="660" y="475" width="120" height="36" rx="6" fill="#2a2a3e" stroke="#555" stroke-width="1"/>
  <text x="720" y="498" fill="#ccc" font-size="11" text-anchor="middle">拍第 N 帧</text>

  <text x="795" y="493" fill="#aaa" font-size="18">→</text>

  <rect x="500" y="530" width="120" height="36" rx="6" fill="#3a7a3a" stroke="#5c5" stroke-width="1"/>
  <text x="560" y="553" fill="#5c5" font-size="11" text-anchor="middle">拼接完成</text>

  <!-- Notes -->
  <text x="500" y="600" fill="#888" font-size="11">注意:</text>
  <text x="500" y="618" fill="#666" font-size="10">• 每帧保存为 Session 目录下的 .jpg + 缩略图</text>
  <text x="500" y="634" fill="#666" font-size="10">• 引导线位置 = 上一帧宽度的 75% 处 (30% 重叠)</text>
  <text x="500" y="650" fill="#666" font-size="10">• 底栏缩略图显示已拍帧, 可滑动查看</text>
  <text x="500" y="666" fill="#666" font-size="10">• 移动方向: 固定水平 (后续支持竖直/网格)</text>

  <!-- Second screen: entry point -->
  <rect x="50" y="800" width="340" height="160" rx="8" fill="#1a1a2e" stroke="#333" stroke-width="1"/>
  <text x="220" y="830" fill="#0cf" font-size="14" text-anchor="middle" font-weight="bold">主相机界面接片入口</text>
  <rect x="100" y="850" width="120" height="44" rx="22" fill="none" stroke="#0cf" stroke-width="2"/>
  <text x="160" y="877" fill="#0cf" font-size="14" text-anchor="middle">📷 正常拍照</text>
  <rect x="240" y="850" width="100" height="44" rx="22" fill="#0cf" opacity="0.8"/>
  <text x="290" y="877" fill="#000" font-size="14" text-anchor="middle" font-weight="bold">接片</text>
</svg>